<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#247653" />
    <meta name="description" content="A practical .NET interview study workspace with focused lessons, quizzes, and personal progress." />
    <base href="/" />
    <title>Fieldnotes for .NET</title>
    <link rel="icon" type="image/png" href="images/dotnet.png" />
    <script src="js/pages.js"></script>
    <script src="js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@500;600;650;700;750;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/learning.css" />
    <link rel="stylesheet" href="css/practice.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/startup.css" />
</head>
<body>
    <div id="app">
        <main class="startup" role="status" aria-live="polite">
            <img src="images/dotnet.png" alt=".NET" width="48" height="48" />
            <h1>fieldnotes</h1>
            <p>Opening your workspace...</p>
            <progress class="startup-progress" aria-label="Loading application"></progress>
        </main>
    </div>
    <div id="blazor-error-ui" role="alert">Fieldnotes encountered an error. <a href="" class="reload">Reload</a><button class="dismiss" aria-label="Dismiss error">Close</button></div>
    <noscript>Fieldnotes requires JavaScript and WebAssembly enabled in your browser.</noscript>
    <script src="vendor/prism.js"></script>
    <script src="vendor/prism-csharp.min.js"></script>
    <script src="vendor/prism-sql.min.js"></script>
    <script src="vendor/prism-bash.min.js"></script>
    <script src="vendor/prism-yaml.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/storage.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
